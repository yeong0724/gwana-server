app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cookie:
    secure: true
    max-age: 86400
    same-site: None
  kakao:
    logout-uri: https://kauth.kakao.com/oauth/logout
    # ip check
    logout-redirect-uri: ${app.base-url}/login/oauth2/logout/kakao
    logout-token-uri: https://kapi.kakao.com/v1/user/logout

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  application:
    name: gwana-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/social-login}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:1234}"

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:5d2d2c019e26a0aa2bec0d372d25a460}
            client-secret: ${KAKAO_CLIENT_SECRET:u7rooE7phRvsCwGICLGSFMDZbOSBYpjb}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: ${app.base-url}/login/oauth2/code/kakao
            scope: profile_nickname,profile_image,account_email,name,gender,birthday,birthyear,phone_number
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
      kakao:
        token-url: https://kauth.kakao.com/oauth/token
        userinfo-api-url: https://kapi.kakao.com/v2/user/me

cloud:
  aws:
    s3:
      bucket: gwana-images
    credentials:
      access-key: ${AWS_ACCESS_KEY:AKIASOAPWMLCG4XJFY4C}
      secret-key: "${AWS_SECRET_KEY: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}"
    region:
      static: ap-northeast-2

jwt:
  secret: ${JWT_SECRET:FlRpX30pMqDbiAkmlfArbrmVkDD4RqISskGZmBFax5oGVxzXXWUzTR5JyskiHMIV9M1Oicegkpi46AdvrcX1E6CmTUBc6IFbTPiD}
  expire:
    access-token: 30 # 30분
    refresh-token: 1440 # 24시간

toss:
  secret-key: "${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}"
  api-url: https://api.tosspayments.com

# 선언형 HTTP 클라이언트(@HttpExchange) baseUrl
kakao:
  auth-base-url: https://kauth.kakao.com   # 토큰 발급
  api-base-url: https://kapi.kakao.com      # 사용자정보/로그아웃

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: 0.0.0.0  # 모든 IP에서 접근 허용
  port: 8080

logging:
  level:
    root: INFO
    com.gwana: INFO
    # SQL 디버깅이 필요하면 아래 주석 해제 (운영에선 끄세요)
    # com.gwana.server.mapper: DEBUG
    # org.mybatis: DEBUG

    # log4jdbc 잔재 차단 (드라이버를 바꿔도 의존성이 남아있을 수 있어 명시적으로 OFF)
    jdbc: OFF
    jdbc.sqlonly: OFF
    jdbc.sqltiming: OFF
    jdbc.audit: OFF
    jdbc.resultset: OFF
    jdbc.resultsettable: OFF
    jdbc.connection: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"