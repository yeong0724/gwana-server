app:
  base-url: ${APP_BASE_URL}
  cookie:
    secure: true
    max-age: 86400
    same-site: None
  kakao:
    logout-uri: https://kauth.kakao.com/oauth/logout
    # ip check
    logout-redirect-uri: ${app.base-url}/login/oauth2/logout/kakao
    logout-token-uri: https://kapi.kakao.com/v1/user/logout

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  application:
    name: gwana-server

  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mysql://mysql-gwana-database.crwassomidre.ap-northeast-2.rds.amazonaws.com:3306/gwana-db?serverTimezone=Asia/Seoul
    username: myuser
    password: "${DB_PASSWORD}"

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 5d2d2c019e26a0aa2bec0d372d25a460
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: ${app.base-url}/login/oauth2/code/kakao
            scope: profile_nickname,profile_image,account_email,name,gender,birthday,birthyear,phone_number
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
      kakao:
        token-url: https://kauth.kakao.com/oauth/token
        userinfo-api-url: https://kapi.kakao.com/v2/user/me

cloud:
  aws:
    s3:
      bucket: gwana-images
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2

jwt:
  secret: ${JWT_SECRET}
  expire:
    access-token: 30 # 30분
    refresh-token: 1440 # 24시간

toss:
  secret-key: ${TOSS_SECRET_KEY}
  api-url: https://api.tosspayments.com

# MyBatis 상세 로그 활성화
mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: 0.0.0.0  # 모든 IP에서 접근 허용
  port: 8080

logging:
  level:
    root: INFO
    com.gwana: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"