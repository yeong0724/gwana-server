app:
  base-url: http://localhost:3000
  cookie:
    secure: true
    max-age: 86400
  kakao:
    logout-uri: https://kauth.kakao.com/oauth/logout
    # ip check
    logout-redirect-uri: ${app.base-url}/login/oauth2/logout/kakao
    logout-token-uri: https://kapi.kakao.com/v1/user/logout

spring:
  devtools:
    restart:
      enabled: false
  application:
    name: gwana-server

  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mysql://localhost:3306/social-login?serverTimezone=UTC
    username: root
    password: 1234

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 5d2d2c019e26a0aa2bec0d372d25a460
            client-secret: u7rooE7phRvsCwGICLGSFMDZbOSBYpjb
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: ${app.base-url}/login/oauth2/code/kakao
            scope: profile_nickname,profile_image,account_email,name,gender,birthday,birthyear,phone_number
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
      kakao:
        token-url: https://kauth.kakao.com/oauth/token
        userinfo-api-url: https://kapi.kakao.com/v2/user/me

