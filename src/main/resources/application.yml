# MyBatis 상세 로그 활성화
mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: 0.0.0.0  # 모든 IP에서 접근 허용
  port: 8080

# 로깅 설정 추가
logging:
  level:
    jdbc.sqlonly: DEBUG
    jdbc.resultsettable: DEBUG  # 결과 테이블 형태로 보기 (선택)
    jdbc.sqltiming: OFF      # 실행 시간 (필요하면 DEBUG)
    jdbc.audit: OFF
    jdbc.resultset: OFF
    jdbc.connection: OFF

    web: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

    # MyBatis 관련 로그
    com.inflearn.sociallogin.mapper: DEBUG  # 본인 Mapper 패키지
    org.apache.ibatis: DEBUG
    org.mybatis: DEBUG

    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"